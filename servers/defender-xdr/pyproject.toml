[project]
name = "zerosoc-mcp-defender-xdr"
version = "0.3.6"
description = "Model Context Protocol (MCP) server for Microsoft Defender XDR: a thin wrapper that exposes every operation of the zerosoc-defender-xdr tool client as an MCP tool"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "zerosoc-defender-xdr==0.3.6",
    "mcp>=2,<3",
]

[project.urls]
Homepage = "https://github.com/ZeroSOC/zerosoc-mcp"
Repository = "https://github.com/ZeroSOC/zerosoc-mcp"
Issues = "https://github.com/ZeroSOC/zerosoc-mcp/issues"
Changelog = "https://github.com/ZeroSOC/zerosoc-mcp/blob/main/CHANGELOG.md"
Source = "https://github.com/ZeroSOC/zerosoc-mcp/tree/main/servers/defender-xdr"

[project.scripts]
mcp-defender-xdr = "zerosoc_mcp_defender_xdr.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zerosoc_mcp_defender_xdr"]
