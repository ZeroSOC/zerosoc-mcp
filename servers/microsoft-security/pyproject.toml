[project]
name = "zerosoc-mcp-microsoft-security"
version = "0.4.0"
description = "Model Context Protocol (MCP) server for Microsoft security (Defender XDR, Defender for Endpoint, Entra ID, Microsoft Purview Audit): a thin wrapper that exposes every operation of the zerosoc-microsoft-security tool client as an MCP tool"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "zerosoc-microsoft-security==0.4.0",
    "mcp>=2,<3",
]

[project.urls]
Homepage = "https://github.com/ZeroSOC/zerosoc-mcp"
Repository = "https://github.com/ZeroSOC/zerosoc-mcp"
Issues = "https://github.com/ZeroSOC/zerosoc-mcp/issues"
Changelog = "https://github.com/ZeroSOC/zerosoc-mcp/blob/main/CHANGELOG.md"
Source = "https://github.com/ZeroSOC/zerosoc-mcp/tree/main/servers/microsoft-security"

[project.scripts]
mcp-microsoft-security = "zerosoc_mcp_microsoft_security.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zerosoc_mcp_microsoft_security"]
