name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    # Contributions are accepted under the DCO (CONTRIBUTING.md). A policy that
    # nothing checks is not a policy.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format='%B' "$c" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") is not signed off by $author"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "Sign off with 'git commit -s' (see CONTRIBUTING.md)."; exit 1; }

  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: make sync
      - run: make ci

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: make sync
      - run: make audit

  standalone:
    # The server must run on its own: built wheels, a clean environment, an MCP host over stdio.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: |
          uv build --package zerosoc-defender-xdr -o wheels
          uv build --package zerosoc-mcp-defender-xdr -o wheels
          uv venv clean
          uv pip install --python clean/bin/python --find-links wheels zerosoc-mcp-defender-xdr
          clean/bin/python .github/standalone_host.py "$PWD/clean/bin/mcp-defender-xdr"

  documented-install:
    # The uvx command the README prints must work for someone who has never
    # cloned this repository. It resolves two packages out of one commit, which
    # is exactly the shape that broke in 0.3.5.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Run the README command against this commit
        working-directory: repo
        run: |
          # The requirement is pinned to this commit. Unpinned, uv asks the clone for its default
          # branch, and a pull-request checkout has no branch for it to find:
          # `git rev-parse refs/remotes/origin/HEAD` fails and the job never reaches the
          # resolution it exists to test. A push to main has a branch, so this only ever showed on
          # a pull request, and only on one whose uv cache did not already hold the checkout.
          # A user follows the README with a URL and a tag; here the commit under test is the
          # revision, which is what this job means by "against this commit".
          REF="$PWD"
          REV="$(git rev-parse HEAD)"
          cd "$RUNNER_TEMP"
          uvx --from "git+file://$REF@$REV#subdirectory=servers/defender-xdr" \
              --with "git+file://$REF@$REV#subdirectory=clients/defender-xdr" \
              --python 3.12 \
              mcp-defender-xdr --help > /dev/null 2>&1 || true
          uvx --from "git+file://$REF@$REV#subdirectory=servers/defender-xdr" \
              --with "git+file://$REF@$REV#subdirectory=clients/defender-xdr" \
              --python 3.12 \
              python -c "import zerosoc_mcp_defender_xdr, zerosoc_defender_xdr; print('resolved', zerosoc_defender_xdr.__name__)"
