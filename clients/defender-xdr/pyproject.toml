[project]
name = "zerosoc-defender-xdr"
version = "0.3.6"
description = "Typed tool client for Microsoft Defender XDR: Microsoft Graph security, Defender for Endpoint and Entra ID logs. The MCP server in servers/defender-xdr is a thin wrapper over it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/ZeroSOC/zerosoc-mcp"
Repository = "https://github.com/ZeroSOC/zerosoc-mcp"
Issues = "https://github.com/ZeroSOC/zerosoc-mcp/issues"
Changelog = "https://github.com/ZeroSOC/zerosoc-mcp/blob/main/CHANGELOG.md"
Source = "https://github.com/ZeroSOC/zerosoc-mcp/tree/main/clients/defender-xdr"

[project.scripts]
zerosoc-defender-xdr = "zerosoc_defender_xdr.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zerosoc_defender_xdr"]
