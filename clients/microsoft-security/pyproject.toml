[project]
name = "zerosoc-microsoft-security"
version = "0.4.0"
description = "Typed tool client for Microsoft security: Defender XDR and Microsoft Graph security, Defender for Endpoint, Entra ID logs and the Microsoft Purview audit log. The MCP server in servers/microsoft-security is a thin wrapper over it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/ZeroSOC/zerosoc-mcp"
Repository = "https://github.com/ZeroSOC/zerosoc-mcp"
Issues = "https://github.com/ZeroSOC/zerosoc-mcp/issues"
Changelog = "https://github.com/ZeroSOC/zerosoc-mcp/blob/main/CHANGELOG.md"
Source = "https://github.com/ZeroSOC/zerosoc-mcp/tree/main/clients/microsoft-security"

[project.scripts]
zerosoc-microsoft-security = "zerosoc_microsoft_security.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zerosoc_microsoft_security"]
