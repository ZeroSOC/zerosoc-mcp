[project]
name = "zerosoc-mcp-workspace"
version = "0"
description = "Workspace root of the ZeroSOC MCP servers and tool clients (not published)"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["clients/*", "servers/*"]

# Every member is installed by `uv sync --all-packages` (make sync): a new client or server is a
# directory under clients/ or servers/, and nothing here names it. A member that depends on another
# says so in its own pyproject, under [tool.uv.sources].

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "jsonschema>=4.23",
    "types-jsonschema",
]

[tool.pytest.ini_options]
testpaths = ["clients", "servers"]
asyncio_mode = "auto"
addopts = "-q --import-mode=importlib"
# conftest.py at the root puts every member's tests/ on the path, for the fakes its tests share

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/node_modules", "**/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "E501"]  # the formatter holds code to the width; prose in docstrings is wrapped by hand

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S105", "S106"]

[tool.mypy]
# make typecheck hands mypy every member's src/ and the matching search path
strict = true
python_version = "3.11"
